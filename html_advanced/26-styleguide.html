<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Style Guide</title>
  <style>
    /* Style simple pour la lisibilité */
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    section {
      margin-bottom: 30px;
    }
    h2 {
      color: #333;
      border-bottom: 2px solid #ccc;
      padding-bottom: 5px;
    }
    h3 {
      color: #555;
    }
    ul {
      list-style-type: disc;
      margin-left: 20px;
    }
  </style>
</head>
<body>
  <main>

    <!-- Paragraph section -->
    <section id="paragraphs">
      <h2>Paragraphs</h2>
      <p>This is a paragraph example to illustrate the paragraph section in the style guide.</p>
    </section>

    <!-- Lists -->
    <!-- Lists -->
    <section id="lists">
      <h2>Lists</h2>
      <div>
        <h3>Unordered</h3>
        <ul>
          <li>Item one</li>
          <li>Item two</li>
          <li>Item three</li>
          <li>Item four</li>
        </ul>
      </div>
    </section>

  </main>
